[package]
# A fork release of `shardtree`. The library name stays `shardtree`, so a consumer renames the
# dependency in its manifest and changes no source.
name = "zcashlabs-shardtree"
description = "A space-efficient Merkle tree with witnessing of marked leaves, checkpointing & state restoration. Zcash Labs fork of `shardtree`, which caches the root of a parent node when the roots of both children are known."
version = "0.7.2"
authors = [
    "Kris Nuttycombe <kris@nutty.land>",
]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Overridden: the workspace fields name the upstream repository, and a published fork must point
# at the fork so that a reader of crates.io finds the source of what they are running.
homepage = "https://github.com/zcashlabs/incrementalmerkletree"
repository = "https://github.com/zcashlabs/incrementalmerkletree"
categories.workspace = true

[lib]
name = "shardtree"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
assert_matches = { workspace = true, optional = true }
bitflags.workspace = true
either = { workspace = true, features = ["use_std"] }
incrementalmerkletree.workspace = true
proptest = { workspace = true, optional = true }
incrementalmerkletree-testing = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
assert_matches.workspace = true
incrementalmerkletree = { workspace = true, features = ["test-dependencies"] }
incrementalmerkletree-testing.workspace = true
proptest.workspace = true

[features]
# The legacy-api feature guards types and functions that are useful for
# migrating data previously managed using `incrementalmerkletree/legacy-api` 
# types into the `ShardTree` data structure.
legacy-api = ["incrementalmerkletree/legacy-api"]
# The test-depenencies feature can be enabled to expose types and functions
# that are useful for testing `shardtree` functionality.
test-dependencies = [
  "dep:proptest", 
  "dep:assert_matches", 
  "dep:incrementalmerkletree-testing", 
  "incrementalmerkletree/test-dependencies"
]

[target.'cfg(unix)'.dev-dependencies]
tempfile.workspace = true
